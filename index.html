<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sankey Builder</title>
  <link rel="stylesheet" href="vendor/open-props.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Sankey Builder</h1>
  </header>

  <div id="error" role="status" aria-live="polite"></div>
  <div id="storage-notice" role="status" aria-live="polite"></div>

  <main class="app-layout">
    <aside class="editor-column">
      <section id="node-editor" aria-labelledby="node-editor-heading">
        <h2 id="node-editor-heading">Nodes</h2>
      </section>

      <section id="link-editor" aria-labelledby="link-editor-heading">
        <h2 id="link-editor-heading">Links</h2>
      </section>

      <section id="controls" aria-labelledby="controls-heading">
        <h2 id="controls-heading">Diagram controls</h2>
        <div class="control-row">
          <label for="palette">Palette</label>
          <select id="palette" data-action="update-palette">
            <option value="observable10">Observable 10</option>
            <option value="tableau10">Tableau 10</option>
            <option value="category10">Category 10</option>
            <option value="set2">Set 2</option>
            <option value="dark2">Dark 2</option>
            <option value="manual">Manual</option>
          </select>
        </div>
        <div class="control-row">
          <label for="link-color">Link color</label>
          <select id="link-color" data-action="update-link-color">
            <option value="source">Source</option>
            <option value="target">Target</option>
            <option value="source-target">Source → target</option>
            <option value="static">Static</option>
          </select>
        </div>
        <div class="control-row">
          <label for="alignment">Alignment</label>
          <select id="alignment" data-action="update-alignment">
            <option value="left">Left</option>
            <option value="right">Right</option>
            <option value="center">Center</option>
            <option value="justify">Justify</option>
          </select>
        </div>
        <div class="control-row">
          <label for="theme">Theme</label>
          <select id="theme" data-action="update-theme">
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </section>

      <!-- App-level actions, deliberately outside the settings boxes above. -->
      <div class="io-actions" role="group" aria-label="Diagram file actions">
        <button type="button" id="export-button" data-action="export">Export JSON</button>
        <button type="button" id="export-svg-button" data-action="export-svg">Export SVG</button>
        <button type="button" id="import-button" data-action="import">Import</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden />
        <div id="io-notice" role="status" aria-live="polite"></div>
      </div>
    </aside>

    <div
      id="resizer"
      class="resizer"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize editor column"
      tabindex="0"
    ></div>

    <section id="diagram" aria-label="Sankey diagram"></section>
  </main>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/d3-sankey.min.js"></script>
  <script src="vendor/sortable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
