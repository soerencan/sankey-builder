<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sankey Builder</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Inline icon sprite: small currentColor pictograms, no icon-font/image
       dependency. Referenced elsewhere via <use href="#icon-name">. -->
  <svg hidden>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24">
      <polyline
        points="15 6 9 12 15 18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <polyline
        points="9 6 15 12 9 18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </symbol>

    <!-- Theme mode pictograms. System is a half-filled circle (outline plus a
         solid right half) rather than a monitor glyph, echoing the sun/moon
         pair's own circular shape so all three read as one family. -->
    <symbol id="icon-theme-system" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M12 3 A9 9 0 0 1 12 21 Z" fill="currentColor" />
    </symbol>
    <symbol id="icon-theme-light" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M12 2 L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M12 19 L12 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M2 12 L5 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M19 12 L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M4.93 4.93 L7.05 7.05" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M16.95 16.95 L19.07 19.07" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M4.93 19.07 L7.05 16.95" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M16.95 7.05 L19.07 4.93" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-theme-dark" viewBox="0 0 24 24">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" fill="currentColor" />
    </symbol>

    <!-- Upload and download share a tray and differ only in arrow direction. -->
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M12 15 V3 M7.5 7.5 L12 3 L16.5 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M4 20 H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M12 3 V15 M7.5 10.5 L12 15 L16.5 10.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M4 20 H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-minus" viewBox="0 0 24 24">
      <path d="M5 12 H19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M5 12 H19 M12 5 V19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24">
      <path d="M5 8 V3 M5 3 H10 M5.5 3.5 A9 9 0 1 1 3.5 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
  </svg>

  <!-- The single Preact application root — startApp() (src/app/start-app.tsx)
       renders the header, notices, diagram panel, and data panel into this
       element. The footer stays static: it has no state and no reason to
       re-render. -->
  <div id="app"></div>

  <footer class="app-footer">
    <a href="https://github.com/soerencan/sankey-builder">Source on GitHub</a>
    <a href="https://github.com/soerencan/sankey-builder/blob/main/LICENSE">MIT License</a>
    <a href="./third-party-licenses.html">Third-party licenses</a>
  </footer>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
