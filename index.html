<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sankey Builder</title>
  <link rel="stylesheet" href="vendor/open-props.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Inline icon sprite: small currentColor pictograms, no icon-font/image
       dependency. Referenced elsewhere via <use href="#icon-name">. -->
  <svg hidden>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24">
      <polyline
        points="15 6 9 12 15 18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <polyline
        points="9 6 15 12 9 18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </symbol>

    <!-- Link-color mode pictograms: two endpoint dots joined by a ribbon.
         Modes are distinguished structurally (which endpoint is filled vs.
         outlined, and how the ribbon's opacity ramps) rather than by hue, so
         they stay legible in both themes and under reduced color/contrast. -->
    <symbol id="icon-link-source" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="3" fill="currentColor" />
      <circle cx="19" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M8 12 L10.67 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />
      <path d="M10.67 12 L13.33 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-opacity="0.55" />
      <path d="M13.33 12 L16 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-opacity="0.25" />
    </symbol>
    <symbol id="icon-link-target" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
      <circle cx="19" cy="12" r="3" fill="currentColor" />
      <path d="M8 12 L10.67 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-opacity="0.25" />
      <path d="M10.67 12 L13.33 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-opacity="0.55" />
      <path d="M13.33 12 L16 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />
    </symbol>
    <symbol id="icon-link-gradient" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="3" fill="currentColor" />
      <circle cx="19" cy="12" r="3" fill="currentColor" />
      <path d="M8 12 L10.67 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-opacity="0.35" />
      <path d="M10.67 12 L13.33 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
      <path d="M13.33 12 L16 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" />
    </symbol>
    <symbol id="icon-link-neutral" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
      <circle cx="19" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M8 12 L16 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />
    </symbol>

    <!-- Alignment pictograms: three vertical bars standing in for sankey
         columns. Bar heights and vertical anchoring (not just x position)
         vary so each mode reads as a distinct silhouette at small sizes:
         left/right anchor bars to the top/bottom edge like columns pinned
         to the start/end, center anchors them mid-height, and justify
         stretches the first and last bars edge-to-edge. -->
    <symbol id="icon-align-left" viewBox="0 0 24 24">
      <rect x="1.5" y="4" width="3" height="16" rx="1" fill="currentColor" />
      <rect x="7.5" y="4" width="3" height="11" rx="1" fill="currentColor" />
      <rect x="13.5" y="4" width="3" height="7" rx="1" fill="currentColor" />
    </symbol>
    <symbol id="icon-align-center" viewBox="0 0 24 24">
      <rect x="4.5" y="8.5" width="3" height="7" rx="1" fill="currentColor" />
      <rect x="10.5" y="4" width="3" height="16" rx="1" fill="currentColor" />
      <rect x="16.5" y="8.5" width="3" height="7" rx="1" fill="currentColor" />
    </symbol>
    <symbol id="icon-align-right" viewBox="0 0 24 24">
      <rect x="7.5" y="13" width="3" height="7" rx="1" fill="currentColor" />
      <rect x="13.5" y="9" width="3" height="11" rx="1" fill="currentColor" />
      <rect x="19.5" y="4" width="3" height="16" rx="1" fill="currentColor" />
    </symbol>
    <symbol id="icon-align-justify" viewBox="0 0 24 24">
      <rect x="1.5" y="2" width="3" height="20" rx="1" fill="currentColor" />
      <rect x="10.5" y="8" width="3" height="8" rx="1" fill="currentColor" />
      <rect x="19.5" y="2" width="3" height="20" rx="1" fill="currentColor" />
    </symbol>

    <!-- Theme mode pictograms. System is a half-filled circle (outline plus a
         solid right half) rather than a monitor glyph, echoing the sun/moon
         pair's own circular shape so all three read as one family. -->
    <symbol id="icon-theme-system" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M12 3 A9 9 0 0 1 12 21 Z" fill="currentColor" />
    </symbol>
    <symbol id="icon-theme-light" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M12 2 L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M12 19 L12 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M2 12 L5 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M19 12 L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M4.93 4.93 L7.05 7.05" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M16.95 16.95 L19.07 19.07" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M4.93 19.07 L7.05 16.95" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M16.95 7.05 L19.07 4.93" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-theme-dark" viewBox="0 0 24 24">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" fill="currentColor" />
    </symbol>

    <!-- Display (narrow-toolbar trigger): three sliders, each an offset knob
         on a track — a settings pictogram distinct from the theme dialog's
         gear-free System glyph and from a generic gear, per PLAN.md. -->
    <symbol id="icon-display" viewBox="0 0 24 24">
      <path d="M3 6 L21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <circle cx="9" cy="6" r="2.5" fill="currentColor" />
      <path d="M3 12 L21 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <circle cx="15" cy="12" r="2.5" fill="currentColor" />
      <path d="M3 18 L21 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <circle cx="11" cy="18" r="2.5" fill="currentColor" />
    </symbol>
  </svg>

  <header class="app-header">
    <h1>Sankey Builder</h1>
    <button
      type="button"
      id="theme-button"
      class="toolbar-button"
      data-action="open-theme-dialog"
      aria-haspopup="dialog"
      aria-label="Theme: System"
    >
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-theme-system"></use></svg>
    </button>
  </header>

  <dialog id="theme-dialog" aria-labelledby="theme-dialog-heading">
    <h3 id="theme-dialog-heading">Theme</h3>
    <div class="choice-options" role="group" aria-label="Theme">
      <button
        type="button"
        class="choice-option"
        data-action="set-theme"
        data-value="auto"
        aria-pressed="true"
      >
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-theme-system"></use></svg>
        <span class="choice-option-label">System</span>
      </button>
      <button
        type="button"
        class="choice-option"
        data-action="set-theme"
        data-value="light"
        aria-pressed="false"
      >
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-theme-light"></use></svg>
        <span class="choice-option-label">Light</span>
      </button>
      <button
        type="button"
        class="choice-option"
        data-action="set-theme"
        data-value="dark"
        aria-pressed="false"
      >
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-theme-dark"></use></svg>
        <span class="choice-option-label">Dark</span>
      </button>
    </div>
    <button type="button" class="dialog-close" data-action="close-dialog">Close</button>
  </dialog>

  <div id="error" role="status" aria-live="polite"></div>
  <div id="storage-notice" role="status" aria-live="polite"></div>

  <main class="app-layout">
    <aside class="editor-column">
      <section id="node-editor" aria-labelledby="node-editor-heading">
        <h2 id="node-editor-heading">Nodes</h2>
      </section>

      <section id="link-editor" aria-labelledby="link-editor-heading">
        <h2 id="link-editor-heading">Links</h2>
      </section>

      <!-- App-level actions, deliberately outside the settings boxes above. -->
      <div class="io-actions" role="group" aria-label="Diagram file actions">
        <button type="button" id="export-button" data-action="export">Export JSON</button>
        <button type="button" id="export-svg-button" data-action="export-svg">Export SVG</button>
        <button type="button" id="export-png-button" data-action="export-png">Export PNG</button>
        <button type="button" id="import-button" data-action="import">Import</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden />
        <div id="io-notice" role="status" aria-live="polite"></div>
      </div>
    </aside>

    <div
      id="resizer"
      class="resizer"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize editor column"
      tabindex="0"
    ></div>

    <section class="diagram-panel" aria-labelledby="diagram-heading">
      <header class="diagram-toolbar">
        <h2 id="diagram-heading" class="visually-hidden">Diagram</h2>
        <button type="button" class="toolbar-button" data-action="palette-prev" aria-label="Previous palette">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-chevron-left"></use></svg>
        </button>
        <button
          type="button"
          id="palette-preview"
          class="toolbar-button"
          data-action="open-palette-dialog"
          aria-haspopup="dialog"
          aria-label="Palette"
        >
          <span class="swatch-strip"></span>
        </button>
        <button type="button" class="toolbar-button" data-action="palette-next" aria-label="Next palette">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-chevron-right"></use></svg>
        </button>
        <div class="toolbar-wide">
          <button
            type="button"
            id="links-button"
            class="toolbar-button"
            data-action="open-links-dialog"
            aria-haspopup="dialog"
          >
            Links
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-link-gradient"></use></svg>
          </button>
          <div role="group" aria-label="Alignment" class="align-group">
            <button
              type="button"
              class="align-option"
              data-action="set-alignment"
              data-value="left"
              aria-pressed="false"
              aria-label="Left"
            >
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-align-left"></use></svg>
            </button>
            <button
              type="button"
              class="align-option"
              data-action="set-alignment"
              data-value="center"
              aria-pressed="false"
              aria-label="Center"
            >
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-align-center"></use></svg>
            </button>
            <button
              type="button"
              class="align-option"
              data-action="set-alignment"
              data-value="right"
              aria-pressed="false"
              aria-label="Right"
            >
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-align-right"></use></svg>
            </button>
            <button
              type="button"
              class="align-option"
              data-action="set-alignment"
              data-value="justify"
              aria-pressed="true"
              aria-label="Justify"
            >
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-align-justify"></use></svg>
            </button>
          </div>
        </div>
        <button
          type="button"
          id="display-button"
          class="toolbar-button toolbar-narrow"
          data-action="open-display-dialog"
          aria-haspopup="dialog"
        >
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-display"></use></svg>
          Display
        </button>
      </header>

      <div id="diagram" aria-label="Sankey diagram"></div>

      <dialog id="palette-dialog" aria-labelledby="palette-dialog-heading">
        <h3 id="palette-dialog-heading">Palette</h3>
        <div class="palette-options" role="group" aria-label="Palette">
          <button
            type="button"
            class="palette-option"
            data-action="set-palette"
            data-value="observable10"
            aria-pressed="true"
          >
            <span class="palette-option-label">Observable 10</span>
            <span class="swatch-strip"></span>
          </button>
          <button
            type="button"
            class="palette-option"
            data-action="set-palette"
            data-value="tableau10"
            aria-pressed="false"
          >
            <span class="palette-option-label">Tableau 10</span>
            <span class="swatch-strip"></span>
          </button>
          <button
            type="button"
            class="palette-option"
            data-action="set-palette"
            data-value="category10"
            aria-pressed="false"
          >
            <span class="palette-option-label">Category 10</span>
            <span class="swatch-strip"></span>
          </button>
          <button
            type="button"
            class="palette-option"
            data-action="set-palette"
            data-value="set2"
            aria-pressed="false"
          >
            <span class="palette-option-label">Set 2</span>
            <span class="swatch-strip"></span>
          </button>
          <button
            type="button"
            class="palette-option"
            data-action="set-palette"
            data-value="dark2"
            aria-pressed="false"
          >
            <span class="palette-option-label">Dark 2</span>
            <span class="swatch-strip"></span>
          </button>
        </div>
        <button type="button" class="dialog-close" data-action="close-dialog">Close</button>
      </dialog>

      <dialog id="links-dialog" aria-labelledby="links-dialog-heading">
        <h3 id="links-dialog-heading">Link colors</h3>
        <div class="choice-options" role="group" aria-label="Link colors">
          <button
            type="button"
            class="choice-option"
            data-action="set-link-color"
            data-value="source"
            aria-pressed="false"
          >
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-link-source"></use></svg>
            <span class="choice-option-label">Source</span>
          </button>
          <button
            type="button"
            class="choice-option"
            data-action="set-link-color"
            data-value="source-target"
            aria-pressed="true"
          >
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-link-gradient"></use></svg>
            <span class="choice-option-label">Source to target (gradient)</span>
          </button>
          <button
            type="button"
            class="choice-option"
            data-action="set-link-color"
            data-value="target"
            aria-pressed="false"
          >
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-link-target"></use></svg>
            <span class="choice-option-label">Target</span>
          </button>
          <button
            type="button"
            class="choice-option"
            data-action="set-link-color"
            data-value="static"
            aria-pressed="false"
          >
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-link-neutral"></use></svg>
            <span class="choice-option-label">Neutral</span>
          </button>
        </div>
        <button type="button" class="dialog-close" data-action="close-dialog">Close</button>
      </dialog>

      <!-- Narrow-toolbar equivalent of the wide Links button + .align-group
           above: same classes/data-actions (COPIES, not new ids on the
           options), so the panel's delegated listener and syncToolbar's
           document-wide aria-pressed sync (src/toolbar.ts) already cover
           them. Unlike the other dialogs, choosing here does not close the
           dialog — see src/toolbar.ts. -->
      <dialog id="display-dialog" aria-labelledby="display-dialog-heading">
        <h3 id="display-dialog-heading">Display</h3>
        <div role="group" aria-labelledby="display-link-colors-heading">
          <h4 id="display-link-colors-heading">Link colors</h4>
          <div class="choice-options">
            <button
              type="button"
              class="choice-option"
              data-action="set-link-color"
              data-value="source"
              aria-pressed="false"
            >
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-link-source"></use></svg>
              <span class="choice-option-label">Source</span>
            </button>
            <button
              type="button"
              class="choice-option"
              data-action="set-link-color"
              data-value="source-target"
              aria-pressed="true"
            >
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-link-gradient"></use></svg>
              <span class="choice-option-label">Gradient</span>
            </button>
            <button
              type="button"
              class="choice-option"
              data-action="set-link-color"
              data-value="target"
              aria-pressed="false"
            >
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-link-target"></use></svg>
              <span class="choice-option-label">Target</span>
            </button>
            <button
              type="button"
              class="choice-option"
              data-action="set-link-color"
              data-value="static"
              aria-pressed="false"
            >
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-link-neutral"></use></svg>
              <span class="choice-option-label">Neutral</span>
            </button>
          </div>
        </div>
        <div role="group" aria-labelledby="display-alignment-heading">
          <h4 id="display-alignment-heading">Alignment</h4>
          <div class="choice-options">
            <button
              type="button"
              class="choice-option"
              data-action="set-alignment"
              data-value="left"
              aria-pressed="false"
            >
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-align-left"></use></svg>
              <span class="choice-option-label">Left</span>
            </button>
            <button
              type="button"
              class="choice-option"
              data-action="set-alignment"
              data-value="center"
              aria-pressed="false"
            >
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-align-center"></use></svg>
              <span class="choice-option-label">Center</span>
            </button>
            <button
              type="button"
              class="choice-option"
              data-action="set-alignment"
              data-value="right"
              aria-pressed="false"
            >
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-align-right"></use></svg>
              <span class="choice-option-label">Right</span>
            </button>
            <button
              type="button"
              class="choice-option"
              data-action="set-alignment"
              data-value="justify"
              aria-pressed="true"
            >
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-align-justify"></use></svg>
              <span class="choice-option-label">Justify</span>
            </button>
          </div>
        </div>
        <button type="button" class="dialog-close" data-action="close-dialog">Close</button>
      </dialog>
    </section>
  </main>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/d3-sankey.min.js"></script>
  <script src="vendor/sortable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
