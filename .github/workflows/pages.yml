name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v6
      - run: make lint
      - run: make typecheck
      - run: make test-unit
      # Builds dist/ from scratch and boots it (tests/dist.test.ts), asserting
      # every emitted asset resolves under a simulated /sankey-builder/ base
      # path — the same subpath GitHub Pages project sites serve from. dist/
      # is left in place afterward (the build runs in beforeAll, nothing
      # cleans up after), so the artifact upload below ships exactly what
      # this check exercised.
      - run: make test-dist
      - run: |
          echo "Pages base_path: ${{ steps.pages.outputs.base_path }}"
          echo "make test-dist already asserted the build is safe under this subpath."
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
