name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # biome's bin is a thin Node launcher that immediately re-spawns the
  # platform-native binary, so the Node version is immaterial for linting —
  # no pin needed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: make typecheck

  # Excludes tests/build/dist.test.ts (which runs its own production build) to
  # avoid building dist/ twice in CI — that coverage lives in the artifact
  # job below.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: make test-unit

  # Artifact boot coverage: runs the canonical production build (make build,
  # via tests/build/dist.test.ts) and boots the emitted dist/ bundle against a
  # fresh document, asserting the default diagram renders. dist/ is left in
  # place afterward (the build runs in beforeAll, nothing cleans up after),
  # so the Pages artifact uploaded below ships exactly what this check
  # exercised — deploy never builds a second time.
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: make test-dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Deploys the dist/ built and boot-tested by the artifact job. Runs on a
  # push to main, or a manual redeploy (still gated on main and on every
  # check job passing), so a commit whose checks fail can't reach Pages.
  deploy:
    needs: [lint, typecheck, tests, artifact]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
