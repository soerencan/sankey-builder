services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    platform: linux/amd64
    init: true
    ipc: host
    network_mode: bridge
    environment:
      CI: "1"
      PLAYWRIGHT_VISUAL_TESTS: "1"
    volumes:
      - .:/work
    working_dir: /work
    entrypoint: ["node", "node_modules/@playwright/test/cli.js"]
    command: ["test"]
