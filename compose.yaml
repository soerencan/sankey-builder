services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    platform: linux/amd64
    init: true
    ipc: host
    network_mode: bridge
    environment:
      CI: "1"
      PLAYWRIGHT_VISUAL_TESTS: "1"
    volumes:
      - .:/work
    working_dir: /work
    entrypoint: ["node", "node_modules/@playwright/test/cli.js"]
    command: ["test"]
